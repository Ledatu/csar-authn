# --- Config Source ---
# By default csar-authn reads this file from disk.
# To load config from S3-compatible storage instead, use CLI flags or env vars:
#
#   --config-source / CONFIG_SOURCE          "file" (default) or "s3"
#   --config        / CONFIG_FILE            path to config file (file source, default: config.yaml)
#
# S3 source settings:
#   --config-s3-bucket          / CONFIG_S3_BUCKET              (required for s3)
#   --config-s3-key             / CONFIG_S3_KEY                 (default: config.yaml)
#   --config-s3-endpoint        / CONFIG_S3_ENDPOINT            (default: https://storage.yandexcloud.net)
#   --config-s3-region          / CONFIG_S3_REGION              (default: ru-central1)
#   --config-s3-auth-mode       / CONFIG_S3_AUTH_MODE           (default: static)
#   --config-s3-access-key-id   / CONFIG_S3_ACCESS_KEY_ID
#   --config-s3-secret-access-key / CONFIG_S3_SECRET_ACCESS_KEY
#   --config-s3-iam-token       / CONFIG_S3_IAM_TOKEN
#   --config-s3-oauth-token     / CONFIG_S3_OAUTH_TOKEN
#   --config-s3-sa-key-file     / CONFIG_S3_SA_KEY_FILE
#
# Optional periodic re-fetch (validates new config, hot-reload planned):
#   --config-refresh-interval   / CONFIG_REFRESH_INTERVAL       (default: 0 = disabled; e.g. "60s")

listen_addr: ":8081"
base_url: "http://localhost:8081"
frontend_url: "http://localhost:3000"

database:
  driver: "postgres"
  dsn: "postgres://csar:csar_dev@localhost:5432/csar_auth?sslmode=disable"

jwt:
  algorithm: "RS256"
  issuer: "http://localhost:8081"
  audience: "csar-api"
  ttl: "24h"
  auto_generate: true
  key_dir: "./keys"

oauth:
  session_secret: "${OAUTH_SESSION_SECRET}"
  providers:
    - name: "google"
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      scopes: ["openid", "email", "profile"]
      trusted: true      # Google always verifies emails
    - name: "github"
      client_id: "${GITHUB_CLIENT_ID}"
      client_secret: "${GITHUB_CLIENT_SECRET}"
      scopes: ["user:email"]
      trusted: true      # Goth's GitHub provider only returns verified primary emails
    - name: "discord"
      client_id: "${DISCORD_CLIENT_ID}"
      client_secret: "${DISCORD_CLIENT_SECRET}"
      scopes: ["identify", "email"]
      trusted: false     # Discord email verification is optional
    - name: "telegram"
      client_id: "${TELEGRAM_BOT_CLIENT_ID}"
      client_secret: "${TELEGRAM_BOT_CLIENT_SECRET}"
      scopes: ["openid", "profile", "phone"]
      trusted: false     # no email; phone is verified but trust flag is for email

passkeys:
  enabled: true
  rp_id: "localhost"
  rp_display_name: "CSAR Auth"
  origins: ["http://localhost:3000", "http://localhost:8081"]
  challenge_ttl: "5m"
  state_cookie_name: "csar_passkey_state"
  user_verification: "required"
  attestation: "none"
  state_secret: "${PASSKEY_STATE_SECRET}"

cookie:
  name: "csar_session"
  secure: false
  same_site: "lax"

session:
  max_age: "30d"
  idle_timeout: "7d"
  touch_threshold: "1m"
  cleanup_interval: "1h"

# --- Temporary legacy Telegram JWT login (migration only) ---
# Enables POST /auth/legacy/telegram/session to exchange old HS256 tokens like:
#   {"id": 416663223, "username": "diagen_001", "iat": 1759347122}
# for a normal server-side csar_session cookie. The `id` claim is resolved as
# oauth_accounts(provider="telegram", provider_user_id="<id>"). Tokens without
# exp are accepted and bounded by max_token_age from iat.
# Remove this block and the router route after the legacy portal cutover.
#
# legacy_login:
#   telegram_jwt:
#     enabled: true
#     hmac_secret: "${LEGACY_TELEGRAM_JWT_SECRET}"
#     max_token_age: "720h"
#     endpoint_enabled_until: "2026-08-01T00:00:00Z"

qr_login:
  ttl: "2m"
  max_pending_per_ip: 3
  cleanup_interval: "5m"

# --- Email OTP via Yandex Cloud Postbox (optional) ---
# Enables first-party login/link by email. The sender address must be verified
# in Yandex Cloud Postbox, and the service account must have postbox.sender.
#
# email_otp:
#   enabled: true
#   code_ttl: "5m"
#   max_pending_per_ip: 3
#   max_pending_per_email: 3
#   max_attempts: 5
#   cooldown: "1m"
#   sender_address: "${EMAIL_OTP_FROM_ADDRESS}"
#   sender_name: "CSAR Auth"
#   subject: "Your CSAR sign-in code"
#   postbox:
#     endpoint: "${YANDEX_POSTBOX_ENDPOINT:-https://postbox.cloud.yandex.net}"
#     region: "${YANDEX_POSTBOX_REGION:-ru-central1}"
#     auth:
#       auth_mode: "service_account"
#       sa_key_file: "${YANDEX_POSTBOX_SA_KEY_FILE}"

# --- Redis (optional) ---
# When configured, used for STS replay protection (preferred over Postgres).
# Falls back to Postgres or in-memory if not set.
#
# redis:
#   address: "localhost:6379"
#   password: "${REDIS_PASSWORD}"
#   db: 0

# --- STS: Service Token Exchange (optional) ---
# Enables service-to-service authentication via signed JWT assertions.
# Each service account gets a key pair; the public key is registered here.
# Services exchange short-lived signed assertions for scoped access tokens.
#
# sts:
#   enabled: true
#   assertion_max_age: "5m"    # max age of incoming assertion JWTs
#   service_accounts:
#     first-sa:
#       public_key_file: "/etc/csar-authn/keys/first-sa.pub"
#       allowed_audiences: ["first"]
#       allow_all_audiences: false  # UNSAFE for production with >1 audience; prefer explicit per-request audience
#       token_ttl: "1h"
#     second-sa:
#       public_key_file: "/etc/csar-authn/keys/second-sa.pub"
#       allowed_audiences: ["second"]
#       token_ttl: "30m"
#
# --- Avatar storage via router-backed csar-s3 (optional) ---
# When configured, self-service profile/avatar endpoints call csar-s3 through
# the router using the shared stsclient.ServiceAuthConfig schema. The authn
# service mints upload intents under the fixed `authn-avatars` storage scope, so
# no extra avatar-specific storage env block is needed.
#
# storage_client:
#   router_base_url: "https://csar:8443/svc/s3"
#   sts_endpoint: "https://authn:8081/sts/token"
#   assertion_audience: "https://id.aurum-sky.net"
#   audience: "csar-s3-svc"
#   service_name: "svc:csar-authn"
#   router_timeout: "30s"
#   router_tls:
#     server_name: "api.aurum-sky.net"
#   sts_tls:
#     ca_file: "/etc/csar/tls/ca.pem"
#     cert_file: "/etc/csar/tls/authn-client.pem"
#     key_file: "/etc/csar/tls/authn-client-key.pem"
#   jwt:
#     private_key_file: "./keys/private.pem"
#     public_key_file: "./keys/public.pem"
