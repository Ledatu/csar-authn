name: Go quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: csar_audit_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d csar_audit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUDIT_TEST_DATABASE_URL: postgres://fixture:fixture-only@127.0.0.1:5432/csar_audit_test?sslmode=disable
      CSAR_TEST_DSN: postgres://fixture:fixture-only@127.0.0.1:5432/csar_audit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go build ./...
      - run: go test ./... -race -count=1
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.2
          args: --enable gocritic,misspell ./...
